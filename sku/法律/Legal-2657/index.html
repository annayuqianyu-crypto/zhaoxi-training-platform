<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal-2657  婚内财产分割</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",Arial,sans-serif;background:#F4F6F9;color:#333}
.topbar{background:#04385F;color:#fff;padding:12px 24px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topbar-left{display:flex;align-items:center;gap:14px}
.logo-text{font-size:18px;font-weight:700;letter-spacing:1px;color:#AC9079}
.back-btn{color:#ccc;text-decoration:none;font-size:13px;transition:color .2s}
.back-btn:hover{color:#fff}
.product-header{background:#fff;border-bottom:3px solid #AC9079;padding:20px 32px}
.sku-badge{display:inline-block;background:#AC9079;color:#fff;
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;
  letter-spacing:.5px;margin-bottom:8px}
.product-title{font-size:22px;font-weight:700;color:#04385F;margin-bottom:6px}
.meta-row{font-size:12px;color:#888;display:flex;gap:16px;flex-wrap:wrap}
.slide-count{background:#DDE4EE;color:#04385F;padding:2px 8px;border-radius:8px;font-weight:600}
.main{max-width:1200px;margin:24px auto;padding:0 20px}
.view-toggle{display:flex;gap:8px;margin-bottom:16px}
.btn{padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;
  font-family:inherit;transition:all .2s}
.btn-primary{background:#04385F;color:#fff}
.btn-primary:hover{background:#05467a}
.btn-outline{background:#fff;color:#04385F;border:1.5px solid #04385F}
.btn-outline:hover{background:#DDE4EE}
#view-list .slide-wrap{background:#fff;border-radius:10px;margin-bottom:20px;
  overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer;
  transition:transform .15s,box-shadow .15s;position:relative}
#view-list .slide-wrap:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.14)}
#view-list .slide-wrap img{width:100%;display:block}
#view-list .slide-num{position:absolute;top:10px;right:12px;background:rgba(4,56,95,.75);
  color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
#view-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
#view-grid .slide-wrap{background:#fff;border-radius:8px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer;transition:transform .15s}
#view-grid .slide-wrap:hover{transform:scale(1.02)}
#view-grid .slide-wrap img{width:100%;display:block}
#view-grid .slide-num{text-align:center;font-size:11px;color:#888;padding:4px 0}
.thumb-bar{background:#fff;border-top:2px solid #DDE4EE;padding:12px 20px;
  display:flex;gap:8px;overflow-x:auto;position:fixed;bottom:0;left:0;right:0;z-index:50}
.thumb{height:50px;width:auto;border-radius:4px;cursor:pointer;border:2px solid transparent;
  transition:border-color .15s;flex-shrink:0}
.thumb:hover,.thumb.active{border-color:#AC9079}
/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;
  align-items:center;justify-content:center;flex-direction:column}
#lightbox.open{display:flex}
#lb-img{max-width:92vw;max-height:88vh;border-radius:6px}
#lb-nav{position:absolute;width:100%;display:flex;justify-content:space-between;padding:0 20px}
.lb-btn{background:rgba(255,255,255,.15);color:#fff;border:none;padding:12px 20px;
  font-size:22px;cursor:pointer;border-radius:6px;transition:background .2s}
.lb-btn:hover{background:rgba(255,255,255,.35)}
#lb-close{position:absolute;top:14px;right:20px;background:transparent;color:#fff;
  border:none;font-size:28px;cursor:pointer;z-index:1000}
#lb-counter{position:absolute;bottom:14px;color:#ccc;font-size:13px}
</style>
</head>
<body>

  <div class="topbar-left">

    <a href="../../index.html" class="back-btn">← 返回产品目录</a>
  </div>
  <div style="color:#ccc;font-size:12px">法律</div>
</div>

<div class="main">

  <div id="view-list">

      <div class="slide-wrap" onclick="openLight(8)">

        <div class="slide-num">10 / 10</div>
        <img src="slides/s10.png" alt="第10页" loading="lazy">
      </div></div>
  <div id="view-grid">
      <div class="slide-wrap" onclick="openLight(0)">

        <img src="slides/s10.png" alt="第10页" loading="lazy">
      </div></div>
</div>
<div class="thumb-bar"><img src="slides/s01.png" class="thumb" onclick="openLight(0)" title="第1页" loading="lazy"><img src="slides/s02.png" class="thumb" onclick="openLight(1)" title="第2页" loading="lazy"><img src="slides/s03.png" class="thumb" onclick="openLight(2)" title="第3页" loading="lazy"><img src="slides/s04.png" class="thumb" onclick="openLight(3)" title="第4页" loading="lazy"><img src="slides/s05.png" class="thumb" onclick="openLight(4)" title="第5页" loading="lazy"><img src="slides/s06.png" class="thumb" onclick="openLight(5)" title="第6页" loading="lazy"><img src="slides/s07.png" class="thumb" onclick="openLight(6)" title="第7页" loading="lazy"><img src="slides/s08.png" class="thumb" onclick="openLight(7)" title="第8页" loading="lazy"><img src="slides/s09.png" class="thumb" onclick="openLight(8)" title="第9页" loading="lazy"><img src="slides/s10.png" class="thumb" onclick="openLight(9)" title="第10页" loading="lazy"></div>
<!-- Lightbox -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLight()">✕</button>
  <div id="lb-nav">
    <button class="lb-btn" onclick="lbMove(-1)">&#8592;</button>
    <button class="lb-btn" onclick="lbMove(1)">&#8594;</button>
  </div>
  <img id="lb-img" src="">
  <div id="lb-counter"></div>
</div>
<script>
var imgs=["slides/s01.png", "slides/s02.png", "slides/s03.png", "slides/s04.png", "slides/s05.png", "slides/s06.png", "slides/s07.png", "slides/s08.png", "slides/s09.png", "slides/s10.png"];
var cur=0;
function openLight(i){cur=i;document.getElementById('lightbox').classList.add('open');updateLight();}
function closeLight(){document.getElementById('lightbox').classList.remove('open');}
function lbMove(d){cur=(cur+d+imgs.length)%imgs.length;updateLight();}
function updateLight(){
  document.getElementById('lb-img').src=imgs[cur];
  document.getElementById('lb-counter').textContent=(cur+1)+' / '+imgs.length;
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===cur));
}
function setView(v){
  document.getElementById('view-list').style.display=v==='list'?'block':'none';
  document.getElementById('view-grid').style.display=v==='grid'?'grid':'none';
}
document.addEventListener('keydown',function(e){
  var lb=document.getElementById('lightbox');
  if(lb.classList.contains('open')){
    if(e.key==='ArrowRight')lbMove(1);
    if(e.key==='ArrowLeft')lbMove(-1);
    if(e.key==='Escape')closeLight();
  }
});
</script>
